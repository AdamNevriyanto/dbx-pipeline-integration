name: Databricks Bundle CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  dev_deploy:
    name: Validate and Deploy to Dev
    # Runs only on Pull Requests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: https://dbc-fba03bad-86dd.cloud.databricks.com/
      # Use a developer token or dev-specific service principal for PRs
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_DEV_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Bundle
        run: databricks bundle validate -t dev

      - name: Deploy to Dev
        run: databricks bundle deploy -t dev

  prod_deploy:
    name: Validate and Deploy to Prod
    # Runs only when code is merged/pushed directly to the main branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: https://dbc-fba03bad-86dd.cloud.databricks.com/
      # Use the Production Service Principal (ID: 045f23e4-...) credentials here
      DATABRICKS_CLIENT_ID: ${{ secrets.PROD_SP_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.PROD_SP_CLIENT_SECRET }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Bundle
        run: databricks bundle validate -t prod

      - name: Deploy to Prod
        run: databricks bundle deploy -t prod
