# The main pipeline for dab_dev_jeremi

resources:
  pipelines:
    pipeline_btn_development:
      name: pipeline_btn_development
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/pipeline_btn_development"

      libraries:
        - glob:
            include: ../src/pipeline_btn_development/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
