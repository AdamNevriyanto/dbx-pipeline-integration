bundle:
  name: dbx_pipeline_integration

include:
  - resources/*.yml
  - .databricks/personal_config.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    default: mii_workspace
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  personal:
    mode: development
    default: true
    # variables:
    #   catalog: mii_workspace
    #   schema: jeremi_dev
    # resources:
    #   pipelines:
    #     pipeline_btn_development:
    #       catalog: ${var.catalog}
    #       schema: ${var.schema}

  dev:
    mode: production
    workspace:
      host: https://dbc-fba03bad-86dd.cloud.databricks.com
    variables:
      catalog: mii_workspace
      schema: default
    presets:
      name_prefix: "dev_"

  prod:
    mode: production
    workspace:
      host: https://dbc-fba03bad-86dd.cloud.databricks.com
      root_path: /Workspace/Users/jeremi.santoso@metrodata.co.id/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: mii_workspace
      schema: default
    presets:
      name_prefix: "prod_"
