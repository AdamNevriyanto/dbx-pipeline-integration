catalog: "mii_workspace"

schemas:
  bronze: "default"
  silver: "default"

tables:
  customer:
    bronze_table: "bronze_customer"     
    silver_table: "silver_customer"     

    bronze:
      source_table: "customer"
      source_type: "s3"    
      primary_keys:
        - "CFCIF#"
      partition_column: "CFCIF_NUM"       
      num_partitions: 8
      partition_by_col: "ingested_date"  

      ## Config Postgres AWS (ubah source type di bronze diatas menjadi postgre)
      # postgres:  
      #   host: ""
      #   port: 
      #   database: ""
      #   schema: ""
      #   table: ""
      #   driver: "org.postgresql.Driver"
      #   # Credential
      #   secret_scope: ""
      #   secret_key_user: ""
      #   secret_key_password: ""
      #   ssl_mode: "require"

      #   read_options:
      #     fetchsize: "10000"
      #     partitionColumn: ""
      #     lowerBound: "1"
      #     upperBound: "1000000"
      #     numPartitions: "8"


      ## Config S3
      s3:
        s3_path: "s3://sandbox-dbx/dbx-pipeline-integration/raw/cfmast/"
        format: "csv"
        schema_location: ""
        read_options:
          header: "true"
          delimiter: ","
          cloudFiles.inferColumnTypes: "true"

    silver:
      primary_keys:
        - "CFCIF"
      partition_columns:
        - "CFVDT6"
      deduplicate: false
      incremental_columns: []
        # - "ingested_at"

    columns:
      - name: CFRECI
        source: CFRECI
        type: string
        cleansing:
          trim: true
          null_markers: ["", "NULL"]
      - name: CFRETN
        source: CFRETN
        type: integer
        cleansing:
          trim: true
      - name: CFBNKN
        source: CFBNKN
        type: integer
        cleansing:
          trim: true
      - name: CFBRNN
        source: CFBRNN
        type: integer
        cleansing:
          trim: true
      - name: CFCIF
        source: CFCIF#
        type: string
        cleansing:
          trim: true
      - name: CFALIS
        source: CFALIS
        type: string
        cleansing:
          trim: true
      - name: CFSNME
        source: CFSNME
        type: string
        cleansing:
          trim: true
      - name: CFSEQ
        source: CFSEQ#
        type: integer
        cleansing:
          trim: true
      - name: CFSNPH
        source: CFSNPH
        type: integer
        cleansing:
