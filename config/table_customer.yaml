        type: timestamp
        combine:
          date_column: CFVDT6
          date_format: "ddMMyy"      # DDMMYY
          time_column: CFVTME
          time_format: "HHmmss" 

    dq_rules:
      - rule_name: "consistency_nik"
        rule_category: "consistency"
        column_name: "CFSSNO"
        severity: "WARNING"
        type: "gender_nik_check"
        params:
          ssno_column: CFSSNO
          sex_column: CFSEX

    cleansing:
      columns:
        - name: "nilai"
          null_markers:
            - "0E-8"
            - "-"
            - ""
            - "null"
            - "NULL"
